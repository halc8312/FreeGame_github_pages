<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Company Office</title>
<style>
  :root {
    --bg:#10121c; --panel:#1a1e2e; --panel2:#222743; --line:#2e3552;
    --text:#e8ecf8; --dim:#9aa3c0; --accent:#ffb454; --accent2:#4fc3f7;
    --ok:#58d68d; --meet:#6f9dff; --idle:#8892b0; --alert:#ff6b6b;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif; }
  .top { display:flex; align-items:center; justify-content:space-between; padding:14px 20px 10px; }
  .top h1 { font-size:18px; letter-spacing:2px; }
  .top .sub { color:var(--dim); font-size:11px; }
  .updated { color:var(--dim); font-size:11px; }

  /* --- office map --- */
  .mapwrap { position:relative; width:100%; max-width:1200px; margin:0 auto; }
  .mapwrap > img.map { width:100%; display:block; border-radius:14px; }
  .dept { position:absolute; transform:translate(-50%,-50%); cursor:pointer; text-align:center; width:96px; }
  .dept .bubble { position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    font-size:10px; font-weight:700; padding:2px 8px; border-radius:99px; white-space:nowrap;
    background:var(--panel2); border:1px solid var(--line); color:var(--dim); }
  .dept .bubble.working { background:rgba(88,214,141,.2); color:var(--ok); border-color:var(--ok); }
  .dept .bubble.meeting { background:rgba(111,157,255,.2); color:var(--meet); border-color:var(--meet); }
  .dept .bubble.alert { background:rgba(255,107,107,.2); color:var(--alert); border-color:var(--alert); }
  .dept .av { width:52px; height:52px; border-radius:50%; margin:0 auto;
    background-image:url(assets/avatars.png); background-size:300% 300%;
    border:3px solid var(--line); box-shadow:0 4px 14px rgba(0,0,0,.45); transition:transform .15s; }
  .dept:hover .av { transform:scale(1.12); }
  .dept .name { font-size:10px; font-weight:700; margin-top:3px; color:#fff;
    text-shadow:0 1px 4px #000, 0 0 6px #000; }
  .dept.working .av { border-color:var(--ok); }
  .dept.meeting .av { border-color:var(--meet); }
  .dept.alert .av { border-color:var(--alert); }

  .zone { position:absolute; font-size:10px; font-weight:700; color:#fff; padding:3px 10px;
    border-radius:6px; background:rgba(16,18,28,.55); border:1px solid rgba(255,255,255,.15);
    transform:translateX(-50%); text-shadow:0 1px 3px #000; pointer-events:none; }

  /* --- status board --- */
  .board { position:absolute; top:12px; right:12px; width:190px; background:rgba(16,18,28,.82);
    border:1px solid var(--line); border-radius:12px; padding:12px; backdrop-filter:blur(6px); }
  .board h3 { font-size:11px; color:var(--accent); letter-spacing:1px; margin-bottom:8px; }
  .board .counts { display:flex; gap:8px; margin-bottom:10px; }
  .board .count { flex:1; text-align:center; background:var(--panel2); border-radius:8px; padding:6px 2px; }
  .board .count .n { font-size:18px; font-weight:800; }
  .board .count .l { font-size:9px; color:var(--dim); }
  .board .bars { display:flex; align-items:flex-end; gap:4px; height:44px; margin-bottom:8px; }
  .board .bar { flex:1; background:var(--accent2); border-radius:3px 3px 0 0; min-height:4px; opacity:.85; }
  .board .donut { width:56px; height:56px; border-radius:50%; margin:4px auto 2px;
    background:conic-gradient(var(--ok) 0deg var(--d1,0deg), var(--meet) var(--d1,0deg) var(--d2,0deg), var(--idle) var(--d2,0deg) 360deg); }
  .board .donut-wrap { display:flex; align-items:center; gap:8px; }
  .board .legend { font-size:9px; color:var(--dim); line-height:1.7; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:4px; }

  /* --- detail popup --- */
  .popup { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:10; }
  .popup.on { display:flex; align-items:center; justify-content:center; }
  .popup .card { background:var(--panel); border:1px solid var(--line); border-radius:14px;
    width:min(340px,90vw); padding:18px; }
  .popup .head { display:flex; gap:12px; align-items:center; margin-bottom:10px; }
  .popup .av { width:56px; height:56px; border-radius:12px; background-image:url(assets/avatars.png); background-size:300% 300%; }
  .popup h3 { font-size:16px; }
  .popup .role { font-size:11px; color:var(--dim); }
  .popup .row { font-size:12px; margin-top:8px; line-height:1.6; }
  .popup .lbl { font-size:10px; color:var(--dim); letter-spacing:1px; }
  .popup .close { position:absolute; top:10px; right:14px; color:var(--dim); font-size:20px; cursor:pointer; }
  .popup .prog { height:6px; background:var(--panel2); border-radius:99px; margin-top:6px; overflow:hidden; }
  .popup .prog i { display:block; height:100%; background:var(--accent2); border-radius:99px; }
  .popup a { color:var(--accent2); font-size:11px; text-decoration:none; }

  .wrap { max-width:1100px; margin:0 auto; padding:0 16px 48px; }
  h2 { font-size:15px; color:var(--accent); margin:28px 0 10px; letter-spacing:2px; }
  .list { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .list .row { padding:12px 14px; border-bottom:1px solid var(--line); font-size:13px; display:flex; gap:10px; align-items:baseline; }
  .list .row:last-child { border-bottom:none; }
  .list .row .tag { font-size:10px; padding:1px 7px; border-radius:4px; background:var(--panel2); color:var(--accent2); white-space:nowrap; }
  .list .row .tag.need { color:var(--alert); }
  .list .row .tag.prop { color:var(--accent); }
  .list .row .dim { color:var(--dim); font-size:11px; margin-left:auto; white-space:nowrap; }
  .list a { color:var(--text); text-decoration:none; }
  .list a:hover { color:var(--accent2); }
  /* --- needs-human answer UI --- */
  .need-card { padding:12px 14px; border-bottom:1px solid var(--line); font-size:13px; }
  .need-card:last-child { border-bottom:none; }
  .need-card .q { display:flex; gap:10px; align-items:baseline; }
  .need-card .body { color:var(--dim); font-size:11px; margin:6px 0 4px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .opt-btns { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .opt-btn { background:var(--panel2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:6px 12px; font-size:12px; cursor:pointer; font-family:inherit; }
  .opt-btn:hover { border-color:var(--accent2); color:var(--accent2); }
  .free { display:flex; gap:6px; margin-top:6px; }
  .free input { flex:1; background:var(--panel2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:7px 10px; font-size:12px; font-family:inherit; }
  .free input:focus { outline:none; border-color:var(--accent2); }
  .sent { color:var(--ok); font-size:11px; margin-top:6px; }
  .footer { margin-top:36px; text-align:center; color:var(--dim); font-size:11px; line-height:1.8; }
  .footer a { color:var(--accent2); text-decoration:none; }
  @media (max-width:720px){ .board{position:static;width:100%;margin:10px auto 0} .mapwrap{padding-bottom:8px} }
</style>
</head>
<body>
<div class="top">
  <div>
    <h1>AI COMPANY OFFICE</h1>
    <div class="sub">収益を組織ぐるみで掘る自律AI会社 — 全9部署・24時間稼働</div>
  </div>
  <div class="updated" id="updated">最終更新: -</div>
</div>

<div class="mapwrap">
  <img class="map" src="assets/office-map.png" alt="AI Company Office floor">
  <div id="zones"></div>
  <div id="markers"></div>
  <div class="board" id="board"></div>
</div>

<div class="popup" id="popup"><div class="card" style="position:relative" id="popupBody"></div></div>

<div class="wrap">
<h2>▼ 要 halcy 承認 (needs-human)</h2>
<div class="list" id="needs"></div>
<h2>▼ 進行中の事業提案</h2>
<div class="list" id="proposals"></div>
<h2>▼ 直近の活動レポート</h2>
<div class="list" id="reports"></div>
<div class="footer">
  リポジトリ: <a href="https://github.com/halc8312/ai-company">halc8312/ai-company</a> ·
  Slack: #ai-company / #ai-company-chat / #ai-company-meeting<br>
  このページは「オフィス更新係」が定期的に再生成しています
</div>
</div>

<script type="module">
// ライブデータ(GitHub Pages公開repo、push即反映) → 失敗時は同梱data.json
const DATA_URLS = [
  'https://halc8312.github.io/FreeGame_github_pages/ai-company/data.json?t=',
  'data.json?t=',
];
let DATA = null;
for (const u of DATA_URLS) {
  try { const r = await fetch(u + Date.now()); if (r.ok) { DATA = await r.json(); break; } } catch (e) {}
}
if (!DATA) throw new Error('data.json fetch failed');
document.getElementById('updated').textContent = '最終更新: ' + DATA.generatedAt + (DATA.fetchError ? ' (GitHub取得失敗・' + (DATA.githubOkAt||'-') + ' 時点のデータ)' : '');

// 部署→アバターグリッド位置 & マップ上の座標(オフィス画像基準 %)
const DEPTS = {
  executive:  {av:[0,0], pos:[43,42],  zone:"経営企画室"},
  venture:    {av:[0,1], pos:[47,24],  zone:"新規事業"},
  market:     {av:[0,2], pos:[20,41],  zone:"市場調査"},
  engineering:{av:[1,0], pos:[21,23],  zone:"製品開発"},
  qa:         {av:[1,1], pos:[66,71],  zone:"品質監査"},
  finance:    {av:[1,2], pos:[17,68],  zone:"財務管理"},
  it:         {av:[2,0], pos:[72,24],  zone:"情報システム"},
  hr:         {av:[2,1], pos:[68,45],  zone:"人事組織"},
  digest:     {av:[2,2], pos:[40,70],  zone:"日次報告"},
};
const STATUS_LBL = {working:"本日稼働", meeting:"会議中", idle:"更新なし", alert:"要対応"};
const ZONES = [
  {pos:[90,12], name:"会議室", icon:"◉"},
  {pos:[88,66], name:"ラウンジ(雑談)", icon:"☕"},
];

const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// zone labels
document.getElementById('zones').innerHTML = ZONES.map(z=>
  `<div class="zone" style="left:${z.pos[0]}%;top:${z.pos[1]}%">${z.icon} ${z.name}</div>`).join('');

// dept markers
document.getElementById('markers').innerHTML = DATA.depts.map(d=>{
  const c = DEPTS[d.slug] || DEPTS.digest;
  return `<div class="dept ${d.status}" style="left:${c.pos[0]}%;top:${c.pos[1]}%" onclick="openDept('${d.slug}')">
    <div class="bubble ${d.status}">${STATUS_LBL[d.status]||d.status}</div>
    <div class="av" style="background-position:${c.av[1]*50}% ${c.av[0]*50}%"></div>
    <div class="name">${esc(d.name)}</div>
  </div>`;
}).join('');

// detail popup
window.openDept = slug=>{
  const d = DATA.depts.find(x=>x.slug===slug); if(!d) return;
  const c = DEPTS[slug]||DEPTS.digest;
  document.getElementById('popupBody').innerHTML = `
    <span class="close" onclick="popup.classList.remove('on')">×</span>
    <div class="head">
      <div class="av" style="background-position:${c.av[1]*50}% ${c.av[0]*50}%"></div>
      <div><h3>${esc(d.name)}</h3><div class="role">${esc(d.role)}</div>
      <div class="bubble ${d.status}" style="display:inline-block;position:static;transform:none;margin-top:4px">${STATUS_LBL[d.status]||d.status}</div></div>
    </div>
    <div class="row"><div class="lbl">最新の記録</div>${esc(d.now)}</div>
    <div class="row"><div class="lbl">次の予定</div>${esc(d.next)}${d.openTasks?` <span class="tag">担当issue ${d.openTasks}件</span>`:''}</div>
    <div class="row"><div class="lbl">最終報告</div>${esc(d.lastReport||'-')} <span style="color:var(--dim)">${esc(d.reportPath||'')}</span></div>
    <div class="row"><a href="https://github.com/halc8312/ai-company/tree/main/reports/${slug}" target="_blank">→ この部署のレポート置き場</a></div>`;
  document.getElementById('popup').classList.add('on');
};
document.getElementById('popup').addEventListener('click', e=>{ if(e.target.id==='popup') e.target.classList.remove('on'); });

// status board
const n = s => DATA.depts.filter(d=>d.status===s).length;
const counts = {working:n('working'), meeting:n('meeting'), idle:n('idle'), alert:n('alert')};
const tot = DATA.depts.length || 1;
document.getElementById('board').innerHTML = `
  <h3>全社ステータス</h3>
  <div class="counts">
    <div class="count"><div class="n" style="color:var(--ok)">${counts.working}</div><div class="l">本日稼働</div></div>
    <div class="count"><div class="n" style="color:var(--meet)">${counts.meeting}</div><div class="l">会議中</div></div>
    <div class="count"><div class="n" style="color:var(--idle)">${counts.idle}</div><div class="l">更新なし</div></div>
  </div>
  <div class="bars">${DATA.depts.map(d=>`<div class="bar" style="height:${Math.max(8,(d.activity||0)*100)}%;${d.status==='idle'?'opacity:.3':''}" title="${esc(d.name)}"></div>`).join('')}</div>
  <div class="donut-wrap">
    <div class="donut" style="background:conic-gradient(var(--ok) 0deg ${counts.working/tot*360}deg, var(--meet) ${counts.working/tot*360}deg ${(counts.working+counts.meeting)/tot*360}deg, var(--alert) ${(counts.working+counts.meeting)/tot*360}deg ${(counts.working+counts.meeting+counts.alert)/tot*360}deg, var(--idle) ${(counts.working+counts.meeting+counts.alert)/tot*360}deg 360deg)"></div>
    <div class="legend"><span class="dot" style="background:var(--ok)"></span>稼働 ${counts.working}<br><span class="dot" style="background:var(--meet)"></span>会議 ${counts.meeting}<br><span class="dot" style="background:var(--idle)"></span>待機 ${counts.idle}<br><span class="dot" style="background:var(--alert)"></span>要対応 ${counts.alert}</div>
  </div>`;

// lists
const rows = (list, tag, tagcls) => list.length
  ? list.map(i=>`<div class="row"><span class="tag ${tagcls}">${tag}</span><a href="https://github.com/halc8312/ai-company/issues/${i.num}">#${i.num} ${esc(i.title)}</a><span class="dim">${esc(i.dept||'')}</span></div>`).join('')
  : '<div class="row"><span style="color:var(--dim)">なし</span></div>';
// needs-human: 候補ボタン=回答文をコピーしてGitHub issueページを開く(halcyが認証済みコメントで確定投稿。issue #28 案3)
window.openAnswer=(num,ans,el)=>{
  const url='https://github.com/halc8312/ai-company/issues/'+num;
  const done=()=>{el.innerHTML='<div class="sent">回答文をコピーしました。開いたissueページに貼り付けてコメントを投稿してください</div>';window.open(url,'_blank');};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(ans).then(done).catch(()=>{window.prompt('回答文をコピーしてissueに投稿してください',ans);window.open(url,'_blank');});
  }else{window.prompt('回答文をコピーしてissueに投稿してください',ans);window.open(url,'_blank');}
};
const needsEl=document.getElementById('needs');
needsEl.innerHTML = DATA.needsHuman.length
  ? DATA.needsHuman.map(i=>{
      const opts=(i.options&&i.options.length)?i.options:['承認する','却下・中止する','後で決める','詳細を聞きたい'];
      return `<div class="need-card"><div class="q"><span class="tag need">${i.state==='answered'?'回答受領':'判断待ち'}</span><a href="https://github.com/halc8312/ai-company/issues/${i.num}">#${i.num} ${esc(i.title)}</a><span class="dim">${esc(i.dept||'')}</span></div>`
        +(i.body?`<div class="body">${esc(i.body)}</div>`:'')
        +(i.state==='answered'
          ? '<div class="sent">回答済み — 部署が処理中です</div>'
          : `<div class="ans"><div class="opt-btns">${opts.map(o=>`<button class="opt-btn" data-issue="${i.num}" data-ans="${esc(o)}">${esc(o)}</button>`).join('')}</div><div class="free"><input data-free="${i.num}" placeholder="自由に回答を書く…"><button class="opt-btn" data-issue="${i.num}" data-send="1">コピーしてissueへ</button></div></div>`)
        +`</div>`;
    }).join('')
  : '<div class="row"><span style="color:var(--dim)">なし</span></div>';
needsEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-ans]');
  if(b) return openAnswer(+b.dataset.issue,b.dataset.ans,b.closest('.ans'));
  const s=e.target.closest('[data-send]');
  if(s){const inp=s.closest('.free').querySelector('input');const v=inp.value.trim();if(v)openAnswer(+s.dataset.issue,v,s.closest('.ans'));}
});
document.getElementById('proposals').innerHTML = rows(DATA.proposals,'提案','prop');
document.getElementById('reports').innerHTML = DATA.reports.length
  ? DATA.reports.map(r=>`<div class="row"><span class="tag">${esc(r.dept)}</span><a href="${r.url}">${esc(r.title)}</a><span class="dim">${esc(r.date)}</span></div>`).join('')
  : '<div class="row"><span style="color:var(--dim)">まだレポートなし</span></div>';
</script>
</body>
</html>
